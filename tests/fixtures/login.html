<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Local Test Login</title></head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="Email address" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <label><input id="remember" type="checkbox"> Remember me</label>
      <button type="submit">Sign in</button>
    </form>
    <p id="message" role="alert" aria-live="polite"></p>
    <script>
      document.getElementById('login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.querySelector('main').innerHTML = '<h1>Customer Dashboard</h1><p>Welcome back</p>';
      });
    </script>
  </main>
</body>
</html>
